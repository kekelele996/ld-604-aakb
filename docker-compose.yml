name: grid-repair
services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-grid-repair}-db
    environment:
      MYSQL_DATABASE: ${DB_NAME:-grid_repair}
      MYSQL_USER: ${DB_USER:-grid_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-grid_password}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-grid_password}
    ports:
      - "${DB_PORT:-33060}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-grid_password}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-grid-repair}-backend
    environment:
      PORT: 3000
      NODE_ENV: production
      # 默认使用本地种子内存库，开箱即用；切换 STORAGE=mysql 可改为数据库存储
      STORAGE: ${STORAGE:-memory}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-grid_repair}
      DB_USER: ${DB_USER:-grid_user}
      DB_PASSWORD: ${DB_PASSWORD:-grid_password}
      DATABASE_URL: mysql://${DB_USER:-grid_user}:${DB_PASSWORD:-grid_password}@db:3306/${DB_NAME:-grid_repair}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
    ports:
      - "${BACKEND_PORT:-21104}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-grid-repair}-frontend
    ports:
      - "${FRONTEND_PORT:-20104}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
